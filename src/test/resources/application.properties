spring.datasource.url=jdbc:h2:mem:jobportal;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.password-reset.rate-limit-hash-key=test-only-password-reset-rate-limit-key
app.password-reset.outbox.encryption-keys=test-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.password-reset.outbox.active-key-id=test-key
app.password-reset.outbox.worker-enabled=false
