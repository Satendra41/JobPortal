spring.profiles.default=local
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

app.upload.dir=uploads/resumes
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
app.demo-accounts.hr-email=${DEMO_HR_EMAIL:}
app.demo-accounts.hr-password=${DEMO_HR_PASSWORD:}
app.demo-accounts.admin-email=${DEMO_ADMIN_EMAIL:}
app.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Local HTTP development defaults to non-Secure cookies; the prod profile requires Secure cookies.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Registration OTP and email delivery settings are supplied by the environment.
app.registration.otp.expiration-minutes=${REGISTRATION_OTP_EXPIRATION_MINUTES:5}
app.registration.otp.max-attempts=${REGISTRATION_OTP_MAX_ATTEMPTS:5}
app.registration.otp.resend-cooldown-seconds=${REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS:60}
app.registration.otp.max-resends-per-hour=${REGISTRATION_OTP_MAX_RESENDS_PER_HOUR:5}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:}
app.otp-email.api-url=${OTP_EMAIL_API_URL:}
app.otp-email.api-secret=${OTP_EMAIL_API_SECRET:}
