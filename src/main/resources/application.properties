spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

app.upload.dir=uploads/resumes
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
app.demo-accounts.hr-email=${DEMO_HR_EMAIL:}
app.demo-accounts.hr-password=${DEMO_HR_PASSWORD:}
app.demo-accounts.admin-email=${DEMO_ADMIN_EMAIL:}
app.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Local HTTP development defaults to non-Secure cookies; the prod profile requires Secure cookies.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
