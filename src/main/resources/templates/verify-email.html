<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify your email | JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>
<section class="py-5 auth-page">
    <div class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 auth-card">
                    <div class="card-body p-5">
                        <div class="mb-4 text-center auth-heading">
                            <h2 class="fw-bold auth-title">Verify your email</h2>
                            <p class="text-muted">Enter the six-digit code we sent you. It expires in five minutes.</p>
                        </div>
                        <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                        <form class="auth-form" th:action="@{/verify-email}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${email}" autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="otp" class="form-label">Verification code</label>
                                <input type="text" class="form-control" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 auth-submit">Verify email</button>
                        </form>
                        <form class="mt-3" th:action="@{/verify-email/resend}" method="post">
                            <input type="hidden" name="email" th:value="${email}">
                            <button type="submit" class="btn btn-outline-secondary w-100">Resend code</button>
                        </form>
                        <p class="text-center text-muted mt-4"><a href="/login">Back to Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
