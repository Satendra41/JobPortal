<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application Submitted - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5 text-center">
                        <h2 class="fw-bold mb-3">Application submitted successfully!</h2>
                        <p class="text-muted mb-4">Your application has been recorded. You can track it on the My Applications page.</p>
                        <a class="btn btn-primary me-2" href="/applications">View My Applications</a>
                        <a class="btn btn-outline-primary" href="/jobs">Back to Jobs</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 JobPortal. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
