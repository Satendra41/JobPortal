<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application Submitted - JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<main>
<section class="py-5 application-success-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card application-success-card">
                    <div class="card-body text-center">
                        <div class="application-success-icon" aria-hidden="true"><i class="fas fa-check"></i></div>
                        <span class="profile-page-kicker">Application received</span>
                        <h1 class="fw-bold mb-3">Application submitted successfully</h1>
                        <p class="text-muted mb-4">Your application has been recorded. You can track it on the My Applications page.</p>
                        <div class="application-success-actions">
                            <a class="btn btn-primary" href="/applications">View my applications</a>
                            <a class="btn btn-outline-primary" href="/jobs">Browse jobs</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
