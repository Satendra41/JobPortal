<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5 auth-page auth-login-page">
    <div class="container auth-container">
        <div class="row justify-content-center auth-row">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 auth-card">
                    <div class="card-body p-5 auth-card-body">
                        <div class="mb-4 text-center auth-heading">
                            <h2 class="fw-bold auth-title">Welcome back</h2>
                            <p class="text-muted">Sign in to access your dashboard and job applications.</p>
                        </div>
                        <div th:if="${message}" class="alert alert-success auth-feedback auth-success" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger auth-feedback auth-error" th:text="${error}"></div>
                        <form class="auth-form" th:action="@{/login}" method="post" th:object="${user}">
                            <div class="mb-3 auth-field">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="you@example.com">
                            </div>
                            <div class="mb-3 auth-field">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 auth-submit">Login</button>
                        </form>
                        <p class="text-center text-muted mt-4 auth-switch">New here? <a href="/register">Create an account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 JobPortal. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
