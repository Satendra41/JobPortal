<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5 auth-page auth-register-page">
    <div class="container auth-container">
        <div class="row justify-content-center auth-row">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 auth-card">
                    <div class="card-body p-5 auth-card-body">
                        <div class="mb-4 text-center auth-heading">
                            <h2 class="fw-bold auth-title">Sign Up</h2>
                            <p class="text-muted">Start applying for jobs and build your profile.</p>
                        </div>
                        <div th:if="${message}" class="alert alert-success auth-feedback auth-success" role="status" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger auth-feedback auth-error" role="alert" th:text="${error}"></div>
                        <div class="auth-social-buttons" aria-label="Sign up options">
                            <a th:if="${googleOAuthEnabled}" class="btn auth-social-button" data-oauth-login th:href="@{/oauth2/authorization/google}">
                                <i class="fa-brands fa-google auth-social-icon auth-google-icon" aria-hidden="true"></i>
                                <span>Continue with Google</span>
                            </a>
                            <button th:unless="${googleOAuthEnabled}" class="btn auth-social-button" type="button" disabled
                                    aria-disabled="true" title="Google sign-in is not configured for this environment.">
                                <i class="fa-brands fa-google auth-social-icon auth-google-icon" aria-hidden="true"></i>
                                <span>Continue with Google</span>
                            </button>
                            <a th:if="${githubOAuthEnabled}" class="btn auth-social-button" data-oauth-login th:href="@{/oauth2/authorization/github}">
                                <i class="fa-brands fa-github auth-social-icon" aria-hidden="true"></i>
                                <span>Continue with GitHub</span>
                            </a>
                            <button th:unless="${githubOAuthEnabled}" class="btn auth-social-button" type="button" disabled
                                    aria-disabled="true" title="GitHub sign-in is not configured for this environment.">
                                <i class="fa-brands fa-github auth-social-icon" aria-hidden="true"></i>
                                <span>Continue with GitHub</span>
                            </button>
                        </div>
                        <p th:if="${!googleOAuthEnabled and !githubOAuthEnabled}" class="auth-social-unavailable text-muted" role="status">
                            Social sign-in is unavailable until provider credentials are configured.
                        </p>
                        <div class="auth-divider" aria-hidden="true"><span>OR CONTINUE WITH EMAIL</span></div>
                        <form class="auth-form" th:action="@{/register}" method="post" th:object="${user}">
                            <div class="mb-3 auth-field">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Your full name" autocomplete="name" required>
                            </div>
                            <div class="mb-3 auth-field">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="you@example.com" autocomplete="email" required>
                            </div>
                            <div class="mb-3 auth-field">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group auth-password-group">
                                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Choose a strong password" autocomplete="new-password" required>
                                    <button class="btn btn-outline-secondary auth-password-toggle" type="button"
                                            data-password-toggle aria-controls="password" aria-label="Show password"
                                            aria-pressed="false">
                                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 auth-submit">Sign Up</button>
                        </form>
                        <p class="text-center text-muted mt-4 auth-switch">Already have an account? <a href="/login">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
