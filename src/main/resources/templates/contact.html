<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="row gy-4">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="fw-bold">Get in touch</h2>
                    <p class="text-muted">Have questions or need help with your account? Send us a message.</p>
                    <ul class="list-unstyled text-muted">
                        <li class="mb-3"><i class="fas fa-envelope text-primary me-3"></i>support@jobportal.com</li>
                        <li class="mb-3"><i class="fas fa-phone text-primary me-3"></i>+1 (555) 123-4567</li>
                        <li><i class="fas fa-map-marker-alt text-primary me-3"></i>San Francisco, CA</li>
                    </ul>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 p-4">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Your name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="you@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Tell us how we can help."></textarea>
                        </div>
                        <button type="button" class="btn btn-primary">Send message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 JobPortal. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
