<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HR Dashboard - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="mb-4"><h2 class="fw-bold">HR Dashboard</h2><p class="text-muted mb-1">Welcome, <span th:text="${userName}">HR user</span></p><p class="text-muted">Role: HR</p></div>
        <div class="row g-3 mb-5">
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><p class="text-muted mb-1">Total jobs</p><h3 th:text="${totalJobs}">0</h3></div></div></div>
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><p class="text-muted mb-1">Active jobs</p><h3 th:text="${activeJobs}">0</h3></div></div></div>
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><p class="text-muted mb-1">Closed jobs</p><h3 th:text="${closedJobs}">0</h3></div></div></div>
            <div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><p class="text-muted mb-1">Applications</p><h3 th:text="${totalApplications}">0</h3></div></div></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3"><h4 class="fw-bold mb-0">My jobs</h4><a class="btn btn-outline-primary btn-sm" href="/hr/jobs/new">Post a job</a></div>
        <div class="card shadow-sm border-0"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Title</th><th>Company</th><th>Location</th><th>Type</th><th>Posted</th><th>Deadline</th><th>Status</th><th>Applications</th><th>Actions</th></tr></thead><tbody>
            <tr th:each="job : ${jobs}"><td th:text="${job.title}">Job title</td><td th:text="${job.company}">Company</td><td th:text="${job.location}">Location</td><td th:text="${job.jobType}">Full-time</td><td th:text="${job.postedDate}">2026-09-04</td><td th:text="${job.applicationDeadline != null ? job.applicationDeadline : '-'}">-</td><td><span class="badge" th:classappend="${job.status == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}" th:text="${job.status}">ACTIVE</span></td><td th:text="${applicationCounts[job.id]}">0</td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{'/jobs/' + ${job.id}}">View</a> <a class="btn btn-sm btn-outline-secondary" th:href="@{'/hr/jobs/' + ${job.id} + '/edit'}">Edit</a> <form th:if="${job.status == 'ACTIVE'}" class="d-inline" method="post" th:action="@{'/hr/jobs/' + ${job.id} + '/close'}"><button class="btn btn-sm btn-outline-danger" type="submit">Close</button></form> <a class="btn btn-sm btn-outline-dark" th:href="@{'/hr/jobs/' + ${job.id} + '/applications'}">Applicants</a></td></tr>
            <tr th:if="${#lists.isEmpty(jobs)}"><td colspan="9" class="text-center text-muted py-4">You have not posted any jobs yet.</td></tr>
        </tbody></table></div></div></div>
    </div>
</section>
</body>
</html>
