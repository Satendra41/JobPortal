<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Applications - JobPortal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand" href="/admin/dashboard">JobPortal Admin</a><div><a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a><a class="btn btn-outline-light btn-sm ms-2" href="/admin/users">Users</a><a class="btn btn-outline-light btn-sm ms-2" href="/admin/jobs">Jobs</a></div></div></nav><section class="py-5"><div class="container"><h2 class="fw-bold mb-4">All Applications</h2><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Applicant</th><th>Email</th><th>Job</th><th>Company</th><th>Applied date</th><th>Status</th></tr></thead><tbody><tr th:each="app : ${applications}"><td th:text="${app.applicantName}">Applicant</td><td th:text="${app.applicantEmail}">Email</td><td th:text="${jobMap[app.jobId]?.title}">Job</td><td th:text="${jobMap[app.jobId]?.company}">Company</td><td th:text="${app.appliedDate}">Date</td><td><span class="badge bg-primary" th:text="${app.status}">APPLIED</span></td></tr><tr th:if="${#lists.isEmpty(applications)}"><td colspan="6" class="text-center text-muted py-4">No applications found.</td></tr></tbody></table></div></div></div></section></body></html>
