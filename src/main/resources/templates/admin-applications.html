<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Applications - JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:with="brandText='JAGAQ Admin', brandHref='/admin/dashboard'"><nav th:replace="~{fragments/navigation :: mainNavigation}"></nav></th:block>

<main>
<section class="py-5 admin-page admin-applications-page">
    <div class="container admin-container">
        <header class="admin-page-header">
            <span class="admin-page-kicker">Administration</span>
            <h1 class="fw-bold">All Applications</h1>
            <p class="mb-0">Review application activity across posted jobs.</p>
        </header>

        <div class="card border-0 shadow-sm admin-table-card">
            <div class="table-responsive admin-table-wrap">
                <table class="table align-middle mb-0 admin-table admin-applications-table">
                    <thead><tr><th scope="col">Applicant</th><th scope="col">Email</th><th scope="col">Job</th><th scope="col">Company</th><th scope="col">Applied date</th><th scope="col">Status</th></tr></thead>
                    <tbody>
                        <tr th:each="app : ${applications}">
                            <td class="admin-primary-cell" data-label="Applicant" th:text="${app.applicantName}">Applicant</td>
                            <td data-label="Email" th:text="${app.applicantEmail}">Email</td>
                            <td data-label="Job"><span class="badge demo-job-badge" th:if="${jobMap[app.jobId] != null and jobMap[app.jobId].title != null and #strings.startsWith(jobMap[app.jobId].title, 'DEMO JOB')}">DEMO JOB</span> <span th:text="${jobMap[app.jobId] != null and #strings.startsWith(jobMap[app.jobId].title, 'DEMO JOB — ') ? #strings.substring(jobMap[app.jobId].title, 11) : jobMap[app.jobId]?.title}">Job</span></td>
                            <td data-label="Company" th:text="${jobMap[app.jobId]?.company}">Company</td>
                            <td data-label="Applied date" th:text="${app.appliedDate}">Date</td>
                            <td data-label="Status">
                                <span class="badge application-status-badge admin-application-status"
                                      th:classappend="${app.status == 'APPLIED' ? 'bg-primary' : (app.status == 'SHORTLISTED' ? 'bg-info text-dark' : (app.status == 'INTERVIEW' ? 'bg-warning text-dark' : (app.status == 'SELECTED' ? 'bg-success' : 'bg-danger')))}"
                                      th:text="${app.status}">APPLIED</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(applications)}" class="admin-empty-row">
                            <td colspan="6" class="text-center text-muted py-4">No applications found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
