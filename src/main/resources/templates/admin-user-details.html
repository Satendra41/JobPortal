<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>User Details - JobPortal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav th:replace="~{fragments/navigation :: mainNavigation}"></nav><section class="py-5"><div class="container"><div class="card border-0 shadow-sm"><div class="card-body p-5"><h2 class="fw-bold mb-4" th:text="${user.name}">User</h2><div th:if="${message}" class="alert alert-success" th:text="${message}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><dl class="row"><dt class="col-sm-3">User ID</dt><dd class="col-sm-9" th:text="${user.id}">1</dd><dt class="col-sm-3">Email</dt><dd class="col-sm-9" th:text="${user.email}">email</dd><dt class="col-sm-3">Role</dt><dd class="col-sm-9" th:text="${user.role}">JOB_SEEKER</dd></dl><form th:if="${user.role.name() != 'ADMIN'}" method="post" th:action="@{'/admin/users/' + ${user.id} + '/role'}" class="border-top pt-4 mt-4"><h5 class="fw-bold">Manage role</h5><p class="text-muted">Set this account to Job Seeker or HR. The user must log out and log back in for the new role to take effect.</p><div class="row g-3 align-items-end"><div class="col-md-5"><label class="form-label" for="role">Role</label><select class="form-select" id="role" name="role"><option value="JOB_SEEKER" th:selected="${user.role.name() == 'JOB_SEEKER'}">Job Seeker</option><option value="HR" th:selected="${user.role.name() == 'HR'}">HR</option></select></div><div class="col-md-3"><button class="btn btn-primary" type="submit">Save role</button></div></div></form><p th:if="${user.role.name() == 'ADMIN'}" class="text-muted border-top pt-4 mt-4 mb-0">Administrator roles cannot be changed here.</p></div></div></div></section></body></html>
