<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apply Job - JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div>
                                <h2 class="fw-bold mb-1">Apply for this job</h2>
                                <p class="text-muted mb-0">Complete your application and submit it securely.</p>
                            </div>
                        </div>
                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                        <form th:action="@{/applications/submit}" th:object="${application}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:field="*{jobId}" />
                            <input type="hidden" th:field="*{userId}" />
                            <div class="mb-3">
                                <label class="form-label">Job title</label>
                                <input type="text" class="form-control" th:value="${job.title}" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Company</label>
                                <input type="text" class="form-control" th:value="${job.company}" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Applicant name</label>
                                <input type="text" class="form-control" th:field="*{applicantName}" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Applicant email</label>
                                <input type="email" class="form-control" th:field="*{applicantEmail}" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone number</label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="(555) 123-4567" required>
                            </div>
                            <div class="mb-3">
                                <label for="resumeFile" class="form-label">Upload Resume</label>
                                <input class="form-control" type="file" id="resumeFile" name="resumeFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                                <div class="form-text">Accepted formats: PDF and DOCX. Maximum size: 5 MB.</div>
                            </div>
                            <div class="mb-3">
                                <label for="coverLetter" class="form-label">Cover letter</label>
                                <textarea class="form-control" id="coverLetter" th:field="*{coverLetter}" rows="5" placeholder="Tell us why you are a great fit" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit Application</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 JAGAQ. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
