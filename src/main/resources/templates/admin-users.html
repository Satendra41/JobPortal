<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Users - JobPortal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand" href="/admin/dashboard">JobPortal Admin</a><div><a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a><a class="btn btn-outline-light btn-sm ms-2" href="/admin/jobs">Jobs</a><a class="btn btn-outline-light btn-sm ms-2" href="/admin/applications">Applications</a><a class="btn btn-outline-light btn-sm ms-2" href="/logout">Logout</a></div></div></nav><section class="py-5"><div class="container"><h2 class="fw-bold mb-4">Users</h2><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>ID</th><th>Action</th></tr></thead><tbody><tr th:each="user : ${users}"><td th:text="${user.name}">Name</td><td th:text="${user.email}">Email</td><td><span class="badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-dark' : (user.role.name() == 'HR' ? 'bg-info text-dark' : 'bg-primary')}" th:text="${user.role}">ROLE</span></td><td th:text="${user.id}">1</td><td><a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/users/' + ${user.id}}">View details</a></td></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="text-center text-muted py-4">No users found.</td></tr></tbody></table></div></div></div></section></body></html>
