<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Users - JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:with="brandText='JAGAQ Admin', brandHref='/admin/dashboard'"><nav th:replace="~{fragments/navigation :: mainNavigation}"></nav></th:block>

<section class="py-5 admin-page admin-users-page">
    <div class="container admin-container">
        <header class="admin-page-header">
            <span class="admin-page-kicker">Administration</span>
            <h1 class="fw-bold">Users</h1>
            <p class="mb-0">Review registered accounts and their assigned roles.</p>
        </header>

        <div class="card border-0 shadow-sm admin-table-card">
            <div class="table-responsive admin-table-wrap">
                <table class="table align-middle mb-0 admin-table admin-users-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>ID</th><th>Action</th></tr></thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="admin-primary-cell" th:text="${user.name}">Name</td>
                            <td th:text="${user.email}">Email</td>
                            <td><span class="badge admin-role-badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-dark' : (user.role.name() == 'HR' ? 'bg-info text-dark' : 'bg-primary')}" th:text="${user.role}">ROLE</span></td>
                            <td th:text="${user.id}">1</td>
                            <td><a class="btn btn-sm btn-outline-primary admin-row-action" th:href="@{'/admin/users/' + ${user.id}}">View details</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}" class="admin-empty-row">
                            <td colspan="5" class="text-center text-muted py-4">No users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
