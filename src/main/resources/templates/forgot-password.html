<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Forgot Password | JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="standalone-auth-page">
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>
<main class="standalone-auth-main">
<section class="standalone-auth-card">
    <a class="brand" th:href="@{/}" aria-label="JAGAQ home">JAGAQ</a>
    <h1>Forgot your password?</h1>
    <p>Enter your account email. If it can receive a reset link, we will send one.</p>
    <p th:if="${message}" class="message" role="status" th:text="${message}"></p>
    <form th:action="@{/forgot-password}" method="post">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button type="submit">Send reset link</button>
    </form>
    <a class="back" th:href="@{/login}">Back to sign in</a>
 </section>
</main>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
