<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Forgot Password | JAGAQ</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #faf9f6; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #faf9f6; }
        main { width: min(100%, 460px); padding: 36px; border: 1px solid #e5e7eb; border-radius: 18px; background: #fff; box-shadow: 0 12px 32px #17203312; }
        .brand { color: #167d62; font-size: 1.1rem; font-weight: 800; letter-spacing: .08em; }
        h1 { margin: 22px 0 8px; font-size: clamp(1.6rem, 5vw, 2rem); }
        p { color: #5b6473; line-height: 1.6; }
        label { display: block; margin: 22px 0 8px; font-weight: 650; }
        input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #cbd1d8; border-radius: 9px; font: inherit; }
        input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #167d6266; outline-offset: 2px; }
        button { width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 9px; background: #167d62; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        .message { padding: 12px; border-radius: 8px; background: #edf7f2; color: #135e4a; }
        .back { display: inline-block; margin-top: 22px; color: #167d62; font-weight: 650; }
        @media (max-width: 480px) { main { padding: 26px 22px; } }
    </style>
</head>
<body>
<main>
    <a class="brand" th:href="@{/}" aria-label="JAGAQ home">JAGAQ</a>
    <h1>Forgot your password?</h1>
    <p>Enter your account email. If it can receive a reset link, we will send one.</p>
    <p th:if="${message}" class="message" role="status" th:text="${message}"></p>
    <form th:action="@{/forgot-password}" method="post">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button type="submit">Send reset link</button>
    </form>
    <a class="back" th:href="@{/login}">Back to sign in</a>
</main>
</body>
</html>
