<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved Jobs - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Saved Jobs</h2>
                <p class="text-muted mb-0">Jobs you have bookmarked for later.</p>
            </div>
            <a class="btn btn-outline-primary" href="/jobs">Browse Jobs</a>
        </div>
        <p class="text-muted" th:if="${#lists.isEmpty(savedJobs)}">You have not saved any jobs yet.</p>
        <div class="row g-4">
            <th:block th:each="savedJob : ${savedJobs}" th:with="job=${jobMap[savedJob.jobId]}">
                <div class="col-lg-6" th:if="${job != null}">
                    <div class="card job-card shadow-sm border-0 h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="badge job-badge" th:text="${job.jobType}">Full-time</span>
                                <small class="text-muted" th:text="${job.location}">Remote</small>
                            </div>
                            <h5 th:text="${job.title}">Senior Java Developer</h5>
                            <p class="text-muted mb-2" th:text="${job.company}">ABC Technologies</p>
                            <p class="text-muted mb-3" th:text="${job.skills}">Java, Spring Boot, MySQL</p>
                            <p class="mb-2"><span class="fw-bold">Salary:</span> <span class="text-muted" th:text="${job.salary}">₹6 LPA</span></p>
                            <p class="text-muted small">Saved <span th:text="${#temporals.format(savedJob.savedAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 12:00</span></p>
                            <div class="d-flex gap-2">
                                <a class="btn btn-outline-primary" th:href="@{'/jobs/' + ${job.id}}">View Details</a>
                                <form method="post" th:action="@{'/jobs/' + ${job.id} + '/unsave'}">
                                    <button class="btn btn-outline-secondary" type="submit">Unsave</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center"><p class="mb-0">&copy; 2026 JobPortal. All rights reserved.</p></div>
</footer>
</body>
</html>
