<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved Jobs - JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<main>
<section class="py-5 saved-jobs-page">
    <div class="container saved-jobs-container">
        <div class="d-flex justify-content-between align-items-center mb-4 saved-jobs-header">
            <div class="saved-jobs-heading-copy">
                <span class="saved-jobs-kicker">Your shortlist</span>
                <h1 class="fw-bold mb-1">Saved Jobs</h1>
                <p class="text-muted mb-0">Jobs you have bookmarked for later.</p>
            </div>
            <a class="btn btn-outline-primary saved-jobs-browse" href="/jobs">Browse Jobs</a>
        </div>
        <div class="saved-jobs-empty-state" th:if="${#lists.isEmpty(savedJobs)}" role="status">
            <span class="saved-jobs-empty-icon" aria-hidden="true"><i class="fas fa-bookmark"></i></span>
            <h2 class="h5 fw-bold">Your shortlist starts here</h2>
            <p class="text-muted mb-3">You have not saved any jobs yet.</p>
            <a class="btn btn-primary" href="/jobs">Browse Jobs</a>
        </div>
        <div class="row g-4 saved-jobs-grid">
            <th:block th:each="savedJob : ${savedJobs}" th:with="job=${jobMap[savedJob.jobId]}">
                <div class="col-lg-6" th:if="${job != null}">
                    <div class="card job-card saved-job-card shadow-sm border-0 h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3 saved-job-meta">
                                <span class="badge job-badge" th:text="${job.jobType}">Full-time</span>
                                <small class="text-muted" th:text="${job.location}">Remote</small>
                            </div>
                            <h2 class="h5 saved-job-title" th:text="${job.title}">Senior Java Developer</h2>
                            <p class="text-muted mb-2 saved-job-company" th:text="${job.company}">ABC Technologies</p>
                            <p class="text-muted mb-3 saved-job-skills" th:if="${job.skills != null and !job.skills.isBlank()}" th:text="${job.skills}">Skills</p>
                            <p class="saved-job-salary" th:if="${job.salary != null and !job.salary.isBlank()}"><span class="fw-bold">Salary:</span> <span class="text-muted" th:text="${job.salary}">Salary</span></p>
                            <p class="text-muted small saved-job-date">Saved <span th:text="${#temporals.format(savedJob.savedAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 12:00</span></p>
                            <div class="d-flex gap-2 saved-job-actions">
                                <a class="btn btn-outline-primary" th:href="@{'/jobs/' + ${job.id}}">View Details</a>
                                <form method="post" th:action="@{'/jobs/' + ${job.id} + '/unsave'}">
                                    <button class="btn btn-outline-secondary" type="submit">Unsave</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
