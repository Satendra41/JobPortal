<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Applicants - JobPortal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand" href="/">JobPortal</a><a class="btn btn-outline-light btn-sm" href="/hr/dashboard">Dashboard</a></div></nav><section class="py-5"><div class="container"><h2 class="fw-bold" th:text="'Applicants: ' + ${job.title}">Applicants</h2><p class="text-muted" th:text="${job.company} + ' · ' + ${job.location}">Company</p><div class="card shadow-sm border-0"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="app : ${applications}"><td th:text="${app.applicantName}">Applicant</td><td th:text="${app.applicantEmail}">email</td><td th:text="${app.appliedDate}">Date</td><td th:text="${app.status}">APPLIED</td><td><a class="btn btn-sm btn-outline-primary" th:href="@{'/hr/applications/' + ${app.id}}">View details</a></td></tr><tr th:if="${#lists.isEmpty(applications)}"><td colspan="5" class="text-center text-muted py-4">No applications received yet.</td></tr></tbody></table></div></div></div></div></section></body></html>
