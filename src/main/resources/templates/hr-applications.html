<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Applicants | ' + ${job.title} + ' | JAGAQ'">Applicants | JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<main>
    <section class="py-5 hr-applicants-page">
        <div class="container hr-applicants-container">
            <header class="hr-applicants-header">
                <div>
                    <span class="hr-dashboard-kicker">HR workspace</span>
                    <h1 class="fw-bold" th:text="'Applicants for ' + ${job.title}">Applicants</h1>
                    <p class="text-muted mb-0">
                        <span th:text="${job.company}">Company</span>
                        <span aria-hidden="true"> · </span>
                        <span th:text="${job.location}">Location</span>
                    </p>
                </div>
                <a class="btn btn-outline-primary" href="/hr/jobs">Back to my jobs</a>
            </header>

            <p class="hr-applicants-count" th:if="${!#lists.isEmpty(applications)}"
               th:text="${#lists.size(applications)} + ' applications'">0 applications</p>

            <div class="hr-applicants-empty" th:if="${#lists.isEmpty(applications)}" role="status">
                <h2>No applications yet</h2>
                <p class="text-muted mb-0">Applications for this job will appear here.</p>
            </div>

            <div class="card hr-applicants-card" th:if="${!#lists.isEmpty(applications)}">
                <div class="table-responsive hr-applicants-table-wrap">
                    <table class="table align-middle hr-applicants-table">
                        <thead>
                        <tr>
                            <th scope="col">Candidate</th>
                            <th scope="col">Email</th>
                            <th scope="col">Applied</th>
                            <th scope="col">Status</th>
                            <th scope="col"><span class="visually-hidden">Actions</span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="jobApplicant : ${applications}">
                            <td class="hr-applicant-name" data-label="Candidate" th:text="${jobApplicant.applicantName}">Applicant</td>
                            <td data-label="Email" th:text="${jobApplicant.applicantEmail}">email</td>
                            <td data-label="Applied" th:text="${jobApplicant.appliedDate}">Date</td>
                            <td data-label="Status">
                                <span class="badge application-status-badge"
                                      th:classappend="${jobApplicant.status == 'APPLIED' ? 'bg-primary' : (jobApplicant.status == 'SHORTLISTED' ? 'bg-info text-dark' : (jobApplicant.status == 'INTERVIEW' ? 'bg-warning text-dark' : (jobApplicant.status == 'SELECTED' ? 'bg-success' : 'bg-danger')))}"
                                      th:text="${jobApplicant.status}">APPLIED</span>
                            </td>
                            <td data-label="Review">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{'/hr/applications/' + ${jobApplicant.id}}">Review application</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
