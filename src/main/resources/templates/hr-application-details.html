<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Applicant Details - JobPortal</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:with="contextHref=@{'/hr/jobs/' + ${job.id} + '/applications'}, contextLabel='Back to applicants'"><nav th:replace="~{fragments/navigation :: mainNavigation}"></nav></th:block>
<section class="py-5">
	<div class="container">
		<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
		<h2 class="fw-bold mb-1" th:text="${jobApplication.applicantName}">Applicant</h2>
		<p class="text-muted mb-4" th:text="${job.title + ' - ' + job.company}">Job</p>
		<div class="row g-4">
			<div class="col-lg-7">
				<div class="card shadow-sm border-0">
					<div class="card-body p-4">
						<h5 class="fw-bold">Applicant Profile</h5>
						<dl class="row mt-3">
							<dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${jobApplication.applicantEmail}">email</dd>
							<dt class="col-sm-4">Phone</dt><dd class="col-sm-8" th:text="${applicantProfile.phone != null ? applicantProfile.phone : jobApplication.phone}">phone</dd>
							<dt class="col-sm-4">Location</dt><dd class="col-sm-8" th:text="${applicantProfile.location != null ? applicantProfile.location : '-'}">-</dd>
							<dt class="col-sm-4">Skills</dt><dd class="col-sm-8" th:text="${applicantProfile.skills != null ? applicantProfile.skills : '-'}">-</dd>
							<dt class="col-sm-4">Education</dt><dd class="col-sm-8" th:text="${applicantProfile.education != null ? applicantProfile.education : '-'}">-</dd>
							<dt class="col-sm-4">Experience</dt><dd class="col-sm-8" th:text="${applicantProfile.experience != null ? applicantProfile.experience : '-'}">-</dd>
							<dt class="col-sm-4">Applied date</dt><dd class="col-sm-8" th:text="${jobApplication.appliedDate}">date</dd>
							<dt class="col-sm-4">Cover letter</dt><dd class="col-sm-8" th:text="${jobApplication.coverLetter}">cover letter</dd>
						</dl>
						<div th:if="${applicantProfile.resumePath != null}">
							<a class="btn btn-outline-primary" th:href="@{'/hr/applications/' + ${jobApplication.id} + '/resume'}">View Resume</a>
							<a class="btn btn-outline-secondary ms-2" th:href="@{'/hr/applications/' + ${jobApplication.id} + '/resume?download=true'}">Download Resume</a>
						</div>
						<p class="text-muted" th:if="${applicantProfile.resumePath == null}">Resume not available.</p>
					</div>
				</div>
			</div>
			<div class="col-lg-5">
				<div class="card shadow-sm border-0">
					<div class="card-body p-4">
						<h5 class="fw-bold">Application status</h5>
						<p class="text-muted">Current: <strong th:text="${jobApplication.status}">APPLIED</strong></p>
						<form method="post" th:action="@{'/hr/applications/' + ${jobApplication.id} + '/status'}">
							<label class="form-label" for="status">Change status</label>
							<select class="form-select mb-3" id="status" name="status">
								<option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == jobApplication.status}">APPLIED</option>
							</select>
							<button class="btn btn-primary" type="submit">Update status</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
