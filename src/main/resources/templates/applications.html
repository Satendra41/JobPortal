<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Applications - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">My Applications</h2>
                <p class="text-muted">Review the roles you have applied for and check the status.</p>
            </div>
            <a href="/jobs" class="btn btn-outline-primary">Browse more jobs</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Job title</th>
                            <th>Company</th>
                            <th>Location</th>
                            <th>Applied date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="app : ${applications}">
                            <td th:text="${jobMap[app.jobId]?.title}">Job title</td>
                            <td th:text="${jobMap[app.jobId]?.company}">Company</td>
                            <td th:text="${jobMap[app.jobId]?.location}">Location</td>
                            <td th:text="${app.appliedDate}">2026-08-10</td>
                            <td><span class="badge" th:classappend="${app.status == 'APPLIED' ? 'bg-primary' : (app.status == 'SHORTLISTED' ? 'bg-info text-dark' : (app.status == 'INTERVIEW' ? 'bg-warning text-dark' : (app.status == 'SELECTED' ? 'bg-success' : 'bg-danger')))}" th:text="${app.status}">APPLIED</span></td>
                            <td><a class="btn btn-sm btn-outline-primary" th:if="${jobMap[app.jobId] != null}" th:href="@{'/jobs/' + ${app.jobId}}">View job</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(applications)}">
                            <td colspan="6" class="text-center text-muted py-4">You haven't applied to any jobs yet. <a href="/jobs" class="btn btn-sm btn-outline-primary ms-2">Browse Jobs</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 JobPortal. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
