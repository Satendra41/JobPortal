<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Jobs - JAGAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:with="brandText='JAGAQ Admin', brandHref='/admin/dashboard'"><nav th:replace="~{fragments/navigation :: mainNavigation}"></nav></th:block>

<main>
<section class="py-5 admin-page admin-jobs-page">
    <div class="container admin-container">
        <header class="admin-page-header">
            <span class="admin-page-kicker">Administration</span>
            <h1 class="fw-bold">All Jobs</h1>
            <p class="mb-0">Review job postings and their current status.</p>
        </header>

        <div class="card border-0 shadow-sm admin-table-card">
            <div class="table-responsive admin-table-wrap">
                <table class="table align-middle mb-0 admin-table admin-jobs-table">
                    <thead><tr><th scope="col">Title</th><th scope="col">Company</th><th scope="col">Location</th><th scope="col">Owner</th><th scope="col">Status</th><th scope="col">Posted</th><th scope="col">Action</th></tr></thead>
                    <tbody>
                        <tr th:each="job : ${jobs}">
                            <td class="admin-primary-cell" data-label="Title"><span class="badge demo-job-badge" th:if="${job.title != null and #strings.startsWith(job.title, 'DEMO JOB')}">DEMO JOB</span> <span th:text="${#strings.startsWith(job.title, 'DEMO JOB — ') ? #strings.substring(job.title, 11) : job.title}">Title</span></td>
                            <td data-label="Company" th:text="${job.company}">Company</td>
                            <td data-label="Location" th:text="${job.location}">Location</td>
                            <td data-label="Owner" th:text="${job.ownerId == null or userMap[job.ownerId] == null ? 'Legacy job' : userMap[job.ownerId].name}">Owner</td>
                            <td data-label="Status"><span class="badge admin-status-badge" th:classappend="${job.status == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}" th:text="${job.status}">ACTIVE</span></td>
                            <td data-label="Posted" th:text="${job.postedDate}">Date</td>
                            <td data-label="Action"><a class="btn btn-sm btn-outline-primary admin-row-action" th:href="@{'/jobs/' + ${job.id}}">View</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(jobs)}" class="admin-empty-row">
                            <td colspan="7" class="text-center text-muted py-4">No job postings are available to review.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
