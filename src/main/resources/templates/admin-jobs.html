<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Jobs - JobPortal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm"><div class="container"><a class="navbar-brand" href="/admin/dashboard">JobPortal Admin</a><div><a class="btn btn-outline-light btn-sm" href="/admin/dashboard">Dashboard</a><a class="btn btn-outline-light btn-sm ms-2" href="/admin/users">Users</a><a class="btn btn-outline-light btn-sm ms-2" href="/admin/applications">Applications</a></div></div></nav><section class="py-5"><div class="container"><h2 class="fw-bold mb-4">All Jobs</h2><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Title</th><th>Company</th><th>Location</th><th>Owner</th><th>Status</th><th>Posted</th><th>Action</th></tr></thead><tbody><tr th:each="job : ${jobs}"><td th:text="${job.title}">Title</td><td th:text="${job.company}">Company</td><td th:text="${job.location}">Location</td><td th:text="${job.ownerId == null ? 'Legacy job' : userMap[job.ownerId].name}">Owner</td><td><span class="badge" th:classappend="${job.status == 'ACTIVE' ? 'bg-success' : 'bg-secondary'}" th:text="${job.status}">ACTIVE</span></td><td th:text="${job.postedDate}">Date</td><td><a class="btn btn-sm btn-outline-primary" th:href="@{'/jobs/' + ${job.id}}">View</a></td></tr><tr th:if="${#lists.isEmpty(jobs)}"><td colspan="7" class="text-center text-muted py-4">No jobs found.</td></tr></tbody></table></div></div></div></section></body></html>
