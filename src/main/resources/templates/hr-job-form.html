<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${formTitle} + ' - JobPortal'">Job - JobPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">

                        <h2 class="fw-bold mb-4"
                            th:text="${formTitle}">
                            Post a new job
                        </h2>

                        <form method="post"
                              th:action="${formAction}"
                              th:object="${job}">

                            <div class="row g-3">

                                <!-- Job Title -->
                                <div class="col-md-6">
                                    <label class="form-label" for="title">
                                        Job title
                                    </label>

                                    <input class="form-control"
                                           id="title"
                                           th:field="*{title}"
                                           required>
                                </div>

                                <!-- Company -->
                                <div class="col-md-6">
                                    <label class="form-label" for="company">
                                        Company
                                    </label>

                                    <input class="form-control"
                                           id="company"
                                           th:field="*{company}"
                                           required>
                                </div>

                                <!-- Location -->
                                <div class="col-md-6">
                                    <label class="form-label" for="location">
                                        Location
                                    </label>

                                    <input class="form-control"
                                           id="location"
                                           th:field="*{location}"
                                           required>
                                </div>

                                <!-- Employment Type -->
                                <div class="col-md-6">
                                    <label class="form-label" for="jobType">
                                        Employment type
                                    </label>

                                    <input class="form-control"
                                           id="jobType"
                                           th:field="*{jobType}"
                                           placeholder="Full-time, Part-time"
                                           required>
                                </div>

                                <!-- Work Mode -->
                                <div class="col-md-6">
                                    <label class="form-label" for="workMode">
                                        Work mode
                                    </label>

                                    <select class="form-select"
                                            id="workMode"
                                            th:field="*{workMode}"
                                            required>

                                        <option value="">
                                            Select work mode
                                        </option>

                                        <option value="On-site">
                                            On-site
                                        </option>

                                        <option value="Hybrid">
                                            Hybrid
                                        </option>

                                        <option value="Remote">
                                            Remote
                                        </option>

                                    </select>
                                </div>

                                <!-- Salary -->
                                <div class="col-md-6">
                                    <label class="form-label" for="salary">
                                        Salary
                                    </label>

                                    <input class="form-control"
                                           id="salary"
                                           th:field="*{salary}"
                                           placeholder="₹6 LPA">
                                </div>

                                <!-- Experience -->
                                <div class="col-md-6">
                                    <label class="form-label" for="experience">
                                        Experience
                                    </label>

                                    <input class="form-control"
                                           id="experience"
                                           th:field="*{experience}"
                                           placeholder="2-4 years">
                                </div>

                                <!-- Skills -->
                                <div class="col-md-6">
                                    <label class="form-label" for="skills">
                                        Skills
                                    </label>

                                    <input class="form-control"
                                           id="skills"
                                           th:field="*{skills}"
                                           placeholder="Java, Spring Boot, MySQL">
                                </div>

                                <!-- Application Deadline -->
                                <div class="col-md-6">
                                    <label class="form-label"
                                           for="applicationDeadline">
                                        Application deadline
                                    </label>

                                    <input class="form-control"
                                           type="date"
                                           id="applicationDeadline"
                                           th:field="*{applicationDeadline}">
                                </div>

                                <!-- Job Description -->
                                <div class="col-12">
                                    <label class="form-label"
                                           for="description">
                                        Job description
                                    </label>

                                    <textarea class="form-control"
                                              id="description"
                                              rows="6"
                                              th:field="*{description}"
                                              required></textarea>
                                </div>

                            </div>

                            <!-- Buttons -->
                            <div class="mt-4">

                                <button class="btn btn-primary"
                                        type="submit">
                                    Save job
                                </button>

                                <a class="btn btn-outline-secondary ms-2"
                                   href="/hr/dashboard">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

</body>
</html>
