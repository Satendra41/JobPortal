<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme-init.js}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${formTitle} + ' - JAGAQ'">Job - JAGAQ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<main>
<section class="py-5 hr-job-editor-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">

                <div class="card hr-job-editor-card">
                    <div class="card-body">

                        <header class="hr-job-editor-header">
                            <div>
                                <span class="hr-dashboard-kicker">HR workspace</span>
                                <h1 class="fw-bold mb-2" th:text="${formTitle}">Post a new job</h1>
                                <p class="text-muted mb-0">Add clear, accurate details so candidates can decide whether the role is right for them.</p>
                            </div>
                            <a class="btn btn-outline-secondary" href="/hr/jobs">Back to my jobs</a>
                        </header>

                        <form method="post"
                              th:action="${formAction}"
                              th:object="${job}"
                              class="hr-job-editor-form">

                            <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
                                Please correct the highlighted job details.
                            </div>

                            <div class="row g-3">
                                <div class="col-12"><h2 class="hr-job-editor-section-title">Role details</h2></div>

                                <!-- Job Title -->
                                <div class="col-md-6">
                                    <label class="form-label" for="title">
                                        Job title
                                    </label>

                                    <input class="form-control"
                                           id="title"
                                           th:field="*{title}"
                                           maxlength="180"
                                           required>
                                    <div class="text-danger small" th:errors="*{title}"></div>
                                </div>

                                <!-- Company -->
                                <div class="col-md-6">
                                    <label class="form-label" for="company">
                                        Company
                                    </label>

                                    <input class="form-control"
                                           id="company"
                                           th:field="*{company}"
                                           maxlength="200"
                                           required>
                                    <div class="text-danger small" th:errors="*{company}"></div>
                                </div>

                                <!-- Location -->
                                <div class="col-md-6">
                                    <label class="form-label" for="location">
                                        Location
                                    </label>

                                    <input class="form-control"
                                           id="location"
                                           th:field="*{location}"
                                           maxlength="160"
                                           required>
                                    <div class="text-danger small" th:errors="*{location}"></div>
                                </div>

                                <!-- Employment Type -->
                                <div class="col-md-6">
                                    <label class="form-label" for="jobType">
                                        Employment type
                                    </label>

                                    <input class="form-control"
                                           id="jobType"
                                           th:field="*{jobType}"
                                           maxlength="80"
                                           placeholder="Full-time, Part-time"
                                           required>
                                    <div class="text-danger small" th:errors="*{jobType}"></div>
                                </div>

                                <!-- Work Mode -->
                                <div class="col-md-6">
                                    <label class="form-label" for="workMode">
                                        Work mode
                                    </label>

                                    <select class="form-select"
                                            id="workMode"
                                            th:field="*{workMode}"
                                            required>

                                        <option value="">
                                            Select work mode
                                        </option>

                                        <option value="On-site">
                                            On-site
                                        </option>

                                        <option value="Hybrid">
                                            Hybrid
                                        </option>

                                        <option value="Remote">
                                            Remote
                                        </option>

                                    </select>
                                    <div class="text-danger small" th:errors="*{workMode}"></div>
                                </div>

                                <!-- Salary -->
                                <div class="col-md-6">
                                    <label class="form-label" for="salary">
                                        Salary
                                    </label>

                                    <input class="form-control"
                                           id="salary"
                                           th:field="*{salary}"
                                           maxlength="120"
                                           placeholder="₹6 LPA">
                                </div>

                                <!-- Experience -->
                                <div class="col-md-6">
                                    <label class="form-label" for="experience">
                                        Experience
                                    </label>

                                    <input class="form-control"
                                           id="experience"
                                           th:field="*{experience}"
                                           maxlength="100"
                                           placeholder="2-4 years">
                                </div>

                                <!-- Skills -->
                                <div class="col-md-6">
                                    <label class="form-label" for="skills">
                                        Skills
                                    </label>

                                    <input class="form-control"
                                           id="skills"
                                           th:field="*{skills}"
                                           maxlength="2000"
                                           placeholder="Java, Spring Boot, MySQL">
                                </div>

                                <!-- Application Deadline -->
                                <div class="col-md-6">
                                    <label class="form-label"
                                           for="applicationDeadline">
                                        Application deadline
                                    </label>

                                    <input class="form-control"
                                           type="date"
                                           id="applicationDeadline"
                                           th:field="*{applicationDeadline}">
                                </div>

                                <div class="col-12"><h2 class="hr-job-editor-section-title">Responsibilities and requirements</h2></div>
                                <!-- Job Description -->
                                <div class="col-12">
                                    <label class="form-label"
                                           for="description">
                                        Job description
                                    </label>

                                    <textarea class="form-control"
                                              id="description"
                                              rows="6"
                                              th:field="*{description}"
                                              maxlength="10000"
                                              required></textarea>
                                    <div class="text-danger small" th:errors="*{description}"></div>
                                </div>

                            </div>

                            <!-- Buttons -->
                            <div class="hr-job-editor-actions">

                                <button class="btn btn-primary"
                                        type="submit">
                                    Save job
                                </button>

                                <a class="btn btn-outline-secondary"
                                   href="/hr/dashboard">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
