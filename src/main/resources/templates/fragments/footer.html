<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="siteFooter" class="site-footer">
    <div class="container site-footer-container">
        <section class="site-footer-brand-block" aria-label="JAGAQ">
            <a class="site-footer-brand" th:href="@{/}">JAGAQ</a>
            <p class="site-footer-tagline">Connecting talent with opportunity.</p>
            <p class="site-footer-description">A smarter place to find your next opportunity or the people who will shape your team.</p>
        </section>

        <nav class="site-footer-column" aria-label="Explore">
            <h2 class="site-footer-heading">Explore</h2>
            <a th:href="@{/jobs}">Browse Jobs</a>
            <a th:href="@{/about}">About</a>
            <a th:href="@{/contact}">Contact</a>
        </nav>

        <nav class="site-footer-column" aria-label="For Candidates">
            <h2 class="site-footer-heading">For Candidates</h2>
            <a th:href="@{/register}">Sign Up</a>
            <a th:href="@{/login}">Sign In</a>
            <a th:href="@{/applications}">My Applications</a>
        </nav>

        <nav class="site-footer-column" aria-label="For Employers">
            <h2 class="site-footer-heading">For Employers</h2>
            <a th:href="@{/hr/dashboard}">HR Sign In</a>
            <a th:href="@{/hr/jobs/new}">Post a Job</a>
        </nav>

        <div class="site-footer-bottom">
            <span>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> JAGAQ. All rights reserved.</span>
        </div>
    </div>
</footer>
</body>
</html>
