<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Profile - JobPortal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: mainNavigation}"></nav>

<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card profile-card shadow-sm border-0">
                    <div class="card-body p-5 text-center">
                        <div class="avatar rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 90px; height: 90px;">
                            <i class="fas fa-user fa-2x"></i>
                        </div>
                        <h4 class="fw-bold" th:text="${user.name}">Your name</h4>
                        <p class="text-muted mb-3" th:text="${profile.headline != null ? profile.headline : 'Job Seeker'}">Job Seeker</p>
                        <a class="btn btn-outline-primary w-100 mb-2" th:if="${profile.resumePath != null}" href="/profile/resume">View resume</a>
                        <a class="btn btn-outline-secondary w-100 mb-2" th:if="${profile.resumePath != null}" href="/profile/resume?download=true">Download resume</a>
                        <a class="btn btn-outline-primary w-100" href="/dashboard">Back to dashboard</a>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="fw-bold">Profile details</h2>
                            <span class="badge bg-primary bg-opacity-10 text-primary">Job Seeker</span>
                        </div>
                        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <form method="post" action="/profile" enctype="multipart/form-data" th:object="${profile}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="name">Name</label>
                                <input class="form-control" id="name" name="name" th:value="${user.name}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" id="email" th:value="${user.email}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="phone">Phone</label>
                                <input class="form-control" id="phone" th:field="*{phone}" maxlength="30" pattern="[0-9+() .-]{7,30}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="location">Location</label>
                                <input class="form-control" id="location" th:field="*{location}" maxlength="120">
                            </div>
                            <div class="col-12"><label class="form-label" for="headline">Professional headline</label><input class="form-control" id="headline" th:field="*{headline}" maxlength="160"></div>
                            <div class="col-md-6"><label class="form-label" for="skills">Skills</label><textarea class="form-control" id="skills" th:field="*{skills}" rows="3" maxlength="1000"></textarea></div>
                            <div class="col-md-6"><label class="form-label" for="education">Education</label><textarea class="form-control" id="education" th:field="*{education}" rows="3" maxlength="1000"></textarea></div>
                            <div class="col-12"><label class="form-label" for="experience">Experience</label><textarea class="form-control" id="experience" th:field="*{experience}" rows="3" maxlength="2000"></textarea></div>
                        </div>
                        <hr>
                        <h5>Resume</h5>
                        <p class="text-muted" th:if="${profile.resumePath == null}">No resume uploaded yet.</p>
                        <p class="text-muted" th:if="${profile.resumePath != null}">Resume uploaded. Upload a new PDF to replace it.</p>
                        <input class="form-control" type="file" id="resumeFile" name="resumeFile" accept="application/pdf,.pdf">
                        <div class="mt-4"><button class="btn btn-primary" type="submit">Save profile</button><a class="btn btn-outline-secondary ms-2" href="/dashboard">Cancel</a></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-primary text-white py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 JobPortal. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
