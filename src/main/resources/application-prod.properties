spring.datasource.url=${DB_URL}
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=native
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL}
app.password-reset.rate-limit-hash-key=${PASSWORD_RESET_RATE_LIMIT_HASH_KEY}
app.password-reset.outbox.encryption-keys=${PASSWORD_RESET_OUTBOX_ENCRYPTION_KEYS}
app.password-reset.outbox.active-key-id=${PASSWORD_RESET_OUTBOX_ACTIVE_KEY_ID}
app.password-reset.outbox.worker-enabled=${PASSWORD_RESET_OUTBOX_WORKER_ENABLED:true}
# Restrict forwarded-address processing to explicitly configured proxy sources.
# Empty default trusts no proxies; set PASSWORD_RESET_TRUSTED_PROXY_REGEX to the
# exact proxy address/range regex used by the hosting environment.
server.tomcat.remoteip.internal-proxies=${PASSWORD_RESET_TRUSTED_PROXY_REGEX:^$}
